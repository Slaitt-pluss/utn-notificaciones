<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTN - Panel Docente</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="card header-flex">
            <div>
                <h2>Panel Docente</h2>
                <p id="welcomeTeacher">Bienvenido, Profesor(a)</p>
            </div>
            <button class="btn btn-danger" onclick="logout()">Cerrar Sesión</button>
        </div>

        <!-- Tarjeta de Clase Actual Asignada Automáticamente -->
        <div class="card" style="border-left: 4px solid #38bdf8;">
            <h3>Asignación Actual (Según Horario)</h3>
            <div id="currentClassInfo" style="margin-top: 0.75rem;">
                <p style="color: #94a3b8;">Verificando horario y clase en curso...</p>
            </div>
        </div>

        <!-- Notificación de llegada -->
        <div class="card">
            <h3>Reportar Llegada a Salón</h3>
            <p style="color: #94a3b8; margin-bottom: 1rem;">El aviso se envía automáticamente al grupo de tu clase en curso.</p>
            <div class="form-grid">
                <div class="input-group">
                    <label>Salón / Laboratorio</label>
                    <input type="text" id="classroom" maxlength="40" placeholder="Ej. Edificio B - 204">
                </div>
                <div class="input-group">
                    <label>Mensaje Breve</label>
                    <input type="text" id="notificationMsg" maxlength="500" placeholder="Iniciando clase puntual">
                </div>
            </div>
            <button class="btn" onclick="sendArrival()">Transmitir Llegada</button>
        </div>

        <!-- Comunicación y Pase de Lista -->
        <div class="card">
            <h3>Comunicación y Asistencia</h3>
            <div class="form-grid">
                <div class="input-group">
                    <label>Grupo Detectado</label>
                    <input type="text" id="targetGroupDisplay" readonly style="background: rgba(15, 23, 42, 0.4); color: #38bdf8; font-weight: bold;">
                </div>
            </div>
            <div class="input-group" style="margin-bottom: 1rem; margin-top: 1rem;">
                <label>Enviar Anuncio o Mensaje al Grupo</label>
                <textarea id="groupMessage" rows="2" maxlength="500" placeholder="Escribe un aviso importante para tus alumnos..."></textarea>
            </div>
            <button class="btn" onclick="sendGroupMessage()" style="margin-right: 1rem;">Enviar Mensaje</button>
            <button class="btn" onclick="takeAttendance()" style="background: linear-gradient(135deg, #059669 0%, #047857 100%);">Guardar Pase de Lista</button>
        </div>
    </div>

    <script>
        // Si el servidor responde 401 (sesión vencida o inexistente), regresa al inicio
        const _fetch = window.fetch.bind(window);
        window.fetch = async (...args) => {
            const res = await _fetch(...args);
            if (res.status === 401) { sessionStorage.clear(); window.location.href = 'index.html'; }
            return res;
        };

        // Evita que un texto con < o > se interprete como HTML
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));

        const teacherName = sessionStorage.getItem('userName') || 'Docente';
        document.getElementById('welcomeTeacher').textContent = `Bienvenido, Profesor(a) ${teacherName}`;

        async function logout() {
            try { await fetch('/api/logout', { method: 'POST' }); } catch (e) {}
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        let detectedGroup = '';

        // El servidor revisa el día y la hora actuales contra los horarios y devuelve la clase en curso
        async function detectCurrentClass() {
            const container = document.getElementById('currentClassInfo');
            const groupField = document.getElementById('targetGroupDisplay');

            try {
                const res = await fetch('/api/teacher/current');
                const data = await res.json();
                const classes = data.classes || [];

                if (res.ok && classes.length > 0) {
                    detectedGroup = classes.map(c => c.group).join(', ');
                    groupField.value = detectedGroup;
                    container.innerHTML = classes.map(c => `
                        <p style="font-size: 1.1rem; color: #f8fafc;">📚 Materia: <strong style="color: #38bdf8;">${esc(c.subject)}</strong></p>
                        <p style="margin-top: 0.3rem; margin-bottom: 0.75rem;">🏫 Grupo Asignado: <strong>${esc(c.group)}</strong> | ⏰ Horario: <strong>${esc(c.time)}</strong></p>
                    `).join('');
                } else if (res.ok) {
                    detectedGroup = '';
                    groupField.value = 'Sin clase en curso';
                    container.innerHTML = `<p style="color: #94a3b8;">No tienes una clase en curso en este momento. Aquí aparecerá tu clase 15 minutos antes de que empiece, según el horario registrado por el administrador.</p>`;
                } else {
                    throw new Error(data.message || 'Error del servidor');
                }
            } catch (e) {
                console.error("Error al detectar clase:", e);
                detectedGroup = '';
                groupField.value = '';
                container.innerHTML = `<p style="color: #f43f5e;">No se pudo consultar tu horario. Revisa tu conexión; se reintentará automáticamente.</p>`;
            }
        }

        // Envía un aviso; el servidor decide el grupo según tu horario
        async function postNotice(classroom, message) {
            const res = await fetch('/api/notifications', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ classroom, message })
            });
            const data = await res.json().catch(() => ({}));

            if (!data.success) {
                alert(data.message || 'No se pudo enviar el aviso.');
                return false;
            }
            const groups = (data.groups || []).map(g => g.group).join(', ');
            alert(`¡Aviso enviado con éxito al grupo ${groups}!`);
            return true;
        }

        async function sendArrival() {
            const classroom = document.getElementById('classroom').value.trim();
            const message = document.getElementById('notificationMsg').value.trim();
            if (await postNotice(classroom, message)) {
                document.getElementById('notificationMsg').value = '';
            }
        }

        async function sendGroupMessage() {
            const input = document.getElementById('groupMessage');
            const message = input.value.trim();
            if (!message) {
                alert('Escribe el mensaje que quieres enviar.');
                return;
            }
            const classroom = document.getElementById('classroom').value.trim();
            if (await postNotice(classroom, message)) {
                input.value = '';
            }
        }

        // Pendiente: todavía no guarda nada en la base de datos
        function takeAttendance() {
            if (!detectedGroup) {
                alert('No hay un grupo activo detectado para el pase de lista.');
                return;
            }
            alert(`El pase de lista del grupo ${detectedGroup} aún no está disponible.`);
        }

        detectCurrentClass();
        // La clase cambia con la hora: se vuelve a consultar cada minuto
        setInterval(detectCurrentClass, 60000);
    </script>
</body>
</html>
