<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTN - Sistema de Notificaciones</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container" style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
        <div class="card" style="width: 100%; max-width: 420px; text-align: center;">
            <div style="margin-bottom: 2rem;">
                <h2 style="font-size: 2rem; margin-bottom: 0.5rem;">UTN</h2>
                <h3 style="font-size: 1.1rem; color: #38bdf8; font-weight: 500;">Sistema de Notificaciones</h3>
                <p style="margin-top: 0.5rem; font-size: 0.85rem;">Universidad Tecnológica de Nezahualcóyotl</p>
            </div>
            
            <form id="loginForm" style="text-align: left;">
                <div class="input-group" style="margin-bottom: 1.25rem;">
                    <label for="username">Usuario Institucional</label>
                    <input type="text" id="username" required placeholder="Ej. admin, profesor, alumno">
                </div>
                
                <div class="input-group" style="margin-bottom: 1.5rem;">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn" style="width: 100%; padding: 0.85rem; font-size: 1rem;">Ingresar al Sistema</button>
                <p id="errorMsg" class="error-msg" style="color: #f43f5e; font-size: 0.85rem; margin-top: 1rem; text-align: center;"></p>
            </form>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
